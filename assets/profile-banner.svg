<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">陈逸潇的 GitHub 主页横幅</title>
  <desc id="desc">用好 AI，做出好的 AI 相关东西，持续连接实体商业与科技。</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1e"/>
      <stop offset="0.55" stop-color="#0d1427"/>
      <stop offset="1" stop-color="#101b30"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7aa7ff"/>
      <stop offset="1" stop-color="#40d9ff"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb86c"/>
      <stop offset="1" stop-color="#ff7a9e"/>
    </linearGradient>
    <radialGradient id="blueGlow">
      <stop offset="0" stop-color="#2867ff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#2867ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warmGlow">
      <stop offset="0" stop-color="#ff8a5b" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#ff8a5b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#9fb8df" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000814" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#background)"/>
  <rect width="1200" height="420" rx="28" fill="url(#grid)"/>
  <circle cx="250" cy="60" r="310" fill="url(#blueGlow)"/>
  <circle cx="1110" cy="410" r="260" fill="url(#warmGlow)"/>
  <path d="M0 348 C250 290 420 410 650 330 C860 258 1010 290 1200 220" fill="none" stroke="#8aa6d6" stroke-opacity="0.08" stroke-width="1.5"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans CJK SC', sans-serif">
    <text x="68" y="66" fill="#89a8d8" font-size="13" font-weight="600" letter-spacing="3">YIXIAO CHEN · 陈逸潇</text>
    <text x="68" y="142" fill="#f3f7ff" font-size="48" font-weight="650" letter-spacing="-1.5">用好 AI，</text>
    <text x="68" y="202" fill="url(#blue)" font-size="48" font-weight="650" letter-spacing="-1.5">也做出好的 AI 相关东西。</text>
    <text x="70" y="249" fill="#b6c4dc" font-size="17" font-weight="400">在真实用户、组织、交易与技术变化之间，持续学习、判断和动手。</text>

    <g transform="translate(68 292)">
      <rect width="126" height="38" rx="19" fill="#14213c" stroke="#3f6fbf" stroke-opacity="0.65"/>
      <circle cx="20" cy="19" r="4" fill="#55cfff"/>
      <text x="34" y="24" fill="#dbe8ff" font-size="13" font-weight="600">使用 / USE</text>
    </g>
    <g transform="translate(206 292)">
      <rect width="138" height="38" rx="19" fill="#14213c" stroke="#3f6fbf" stroke-opacity="0.65"/>
      <circle cx="20" cy="19" r="4" fill="#78a6ff"/>
      <text x="34" y="24" fill="#dbe8ff" font-size="13" font-weight="600">创造 / BUILD</text>
    </g>
    <g transform="translate(356 292)">
      <rect width="160" height="38" rx="19" fill="#241c29" stroke="#a26470" stroke-opacity="0.7"/>
      <circle cx="20" cy="19" r="4" fill="#ff9a78"/>
      <text x="34" y="24" fill="#ffe6dc" font-size="13" font-weight="600">实体商业 / BUSINESS</text>
    </g>
    <g transform="translate(528 292)">
      <rect width="152" height="38" rx="19" fill="#14213c" stroke="#3f6fbf" stroke-opacity="0.65"/>
      <circle cx="20" cy="19" r="4" fill="#55cfff"/>
      <text x="34" y="24" fill="#dbe8ff" font-size="13" font-weight="600">科技 / TECHNOLOGY</text>
    </g>

    <text x="70" y="372" fill="#7185a8" font-size="12" letter-spacing="1.8">USER · ORGANIZATION · TRANSACTION · MODEL · AGENT · SYSTEM</text>
  </g>

  <g transform="translate(972 210)" filter="url(#softShadow)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <circle r="132" fill="none" stroke="#6389c9" stroke-opacity="0.26" stroke-width="1.5" stroke-dasharray="4 9">
      <animate attributeName="stroke-dashoffset" values="0;-52" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle r="85" fill="none" stroke="#5ed9ff" stroke-opacity="0.18" stroke-width="1"/>

    <g stroke="#7195d1" stroke-opacity="0.38" stroke-width="1.4">
      <line x1="0" y1="-54" x2="0" y2="-102"/>
      <line x1="54" y1="0" x2="102" y2="0"/>
      <line x1="0" y1="54" x2="0" y2="102"/>
      <line x1="-54" y1="0" x2="-102" y2="0"/>
    </g>

    <circle r="58" fill="#101d36" stroke="url(#blue)" stroke-width="2"/>
    <circle r="48" fill="none" stroke="#4bbfff" stroke-opacity="0.16" stroke-width="8">
      <animate attributeName="r" values="46;50;46" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.12;0.28;0.12" dur="4s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="10" text-anchor="middle" fill="#eef6ff" font-size="31" font-weight="700">AI</text>

    <g transform="translate(0 -130)">
      <circle r="38" fill="#13233f" stroke="#6e9ef1" stroke-width="1.4"/>
      <text x="0" y="5" text-anchor="middle" fill="#d9e8ff" font-size="14" font-weight="600">科技</text>
    </g>
    <g transform="translate(130 0)">
      <circle r="38" fill="#13233f" stroke="#54caef" stroke-width="1.4"/>
      <text x="0" y="5" text-anchor="middle" fill="#d9f7ff" font-size="14" font-weight="600">做出</text>
    </g>
    <g transform="translate(0 130)">
      <circle r="38" fill="#2a1d28" stroke="#e28a79" stroke-width="1.4"/>
      <text x="0" y="5" text-anchor="middle" fill="#ffe4da" font-size="14" font-weight="600">商业</text>
    </g>
    <g transform="translate(-130 0)">
      <circle r="38" fill="#13233f" stroke="#6e9ef1" stroke-width="1.4"/>
      <text x="0" y="5" text-anchor="middle" fill="#d9e8ff" font-size="14" font-weight="600">用好</text>
    </g>
  </g>

  <rect x="0.75" y="0.75" width="1198.5" height="418.5" rx="27.25" fill="none" stroke="#8ba5cf" stroke-opacity="0.2" stroke-width="1.5"/>
</svg>
