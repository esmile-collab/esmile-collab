<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">一笑</title>
  <desc id="desc">深色科幻风格的个人主页横幅，画面中央偏左为笔名「一笑」，带轻微 RGB 错位与扫描线纹理</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0E14" />
      <stop offset="0.55" stop-color="#0D1117" />
      <stop offset="1" stop-color="#101826" />
    </linearGradient>
    <radialGradient id="glowBlue" cx="84%" cy="10%" r="72%">
      <stop offset="0" stop-color="#1F6FEB" stop-opacity="0.20" />
      <stop offset="1" stop-color="#1F6FEB" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowPurple" cx="6%" cy="96%" r="60%">
      <stop offset="0" stop-color="#8957E5" stop-opacity="0.10" />
      <stop offset="1" stop-color="#8957E5" stop-opacity="0" />
    </radialGradient>

    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#FFFFFF" fill-opacity="0.025" />
    </pattern>

    <filter id="noise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" />
      <feColorMatrix type="matrix" values="0 0 0 0 0.55  0 0 0 0 0.65  0 0 0 0 0.85  0 0 0 0.05 0" />
    </filter>

    <clipPath id="slice1"><rect x="0" y="118" width="1200" height="12" /></clipPath>
    <clipPath id="slice2"><rect x="0" y="158" width="1200" height="9" /></clipPath>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="280" rx="14" fill="url(#background)" />
  <rect width="1200" height="280" rx="14" fill="url(#glowBlue)" />
  <rect width="1200" height="280" rx="14" fill="url(#glowPurple)" />

  <!-- 断裂几何线：上方横线（分段） -->
  <g stroke="#58A6FF" stroke-width="1">
    <line x1="112" y1="72" x2="300" y2="72" stroke-opacity="0.28" />
    <line x1="312" y1="72" x2="356" y2="72" stroke-opacity="0.16" />
    <line x1="368" y1="72" x2="404" y2="72" stroke-opacity="0.08" />
  </g>
  <!-- 断裂几何线：下方横线（分段） -->
  <g stroke="#58A6FF" stroke-width="1">
    <line x1="112" y1="222" x2="196" y2="222" stroke-opacity="0.22" />
    <line x1="208" y1="222" x2="330" y2="222" stroke-opacity="0.14" />
    <line x1="342" y1="222" x2="362" y2="222" stroke-opacity="0.07" />
  </g>

  <!-- 右侧稀疏碎片：短条与小方块，营造数据残影 -->
  <g fill="#58A6FF">
    <rect x="952" y="96" width="64" height="2" opacity="0.18" />
    <rect x="1028" y="96" width="26" height="2" opacity="0.10" />
    <rect x="884" y="188" width="38" height="2" opacity="0.14" />
    <rect x="1080" y="150" width="48" height="2" opacity="0.16" />
    <rect x="1140" y="150" width="14" height="2" opacity="0.08" />
  </g>
  <g fill="#BC8CFF">
    <rect x="1064" y="96" width="6" height="6" opacity="0.22" />
    <rect x="934" y="186" width="5" height="5" opacity="0.18" />
    <rect x="1132" y="146" width="4" height="4" opacity="0.20" />
  </g>
  <g stroke="#58A6FF" stroke-width="1" fill="none">
    <path d="M1096 196v34" stroke-opacity="0.14" />
    <path d="M1096 240v12" stroke-opacity="0.07" />
    <circle cx="1096" cy="186" r="3" stroke-opacity="0.22" />
  </g>

  <!-- 角落 HUD 刻度（极简） -->
  <g stroke="#58A6FF" stroke-width="1" fill="none" opacity="0.30">
    <path d="M24 44V24h20" />
    <path d="M1176 236v20h-20" />
  </g>

  <!-- 笔名「一笑」：RGB 错位 + 主层 -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="78" font-weight="700" letter-spacing="8">
    <text x="109" y="168" fill="#4CC9F0" opacity="0.55">一笑</text>
    <text x="115" y="168" fill="#BC8CFF" opacity="0.45">一笑</text>
    <text x="112" y="168" fill="#F0F6FC">一笑</text>
    <!-- 故障切片：两条横向位移的残影 -->
    <text x="112" y="168" fill="#4CC9F0" opacity="0.50" clip-path="url(#slice1)" transform="translate(7 0)">一笑</text>
    <text x="112" y="168" fill="#BC8CFF" opacity="0.45" clip-path="url(#slice2)" transform="translate(-6 0)">一笑</text>
  </g>

  <!-- 与切片对齐的极细横向干扰条 -->
  <rect x="330" y="124" width="46" height="2" fill="#4CC9F0" opacity="0.20" />
  <rect x="88" y="162" width="18" height="2" fill="#BC8CFF" opacity="0.22" />

  <!-- 下划线：主蓝条 + 错位紫条 -->
  <rect x="114" y="200" width="120" height="3" rx="1.5" fill="#58A6FF" />
  <rect x="118" y="205" width="52" height="2" rx="1" fill="#8957E5" opacity="0.55" />
  <rect x="242" y="200" width="8" height="3" rx="1.5" fill="#58A6FF" opacity="0.4" />

  <!-- 扫描线与噪点覆层 -->
  <rect width="1200" height="280" rx="14" fill="url(#scanlines)" />
  <rect width="1200" height="280" rx="14" filter="url(#noise)" />

  <!-- 边框 -->
  <rect x="0.5" y="0.5" width="1199" height="279" rx="13.5" fill="none" stroke="#30363D" />
</svg>
